# Shared settings for every ALFWorld arm. Arms differ ONLY in `advantage`.
# Paper (Qwen2.5-1.5B, full FT, verl-agent): k=k'=1, zeta=0.05, lr=1e-6, KL 0.01, 150 steps.
# Scaled here for Qwen2.5-0.5B + LoRA on a single 8GB GPU.
benchmark: alfworld
env:
  history_length: 2
policy:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  lora_r: 16
  lora_alpha: 32
  max_new_tokens: 256
  temperature: 1.0
  gen_batch_size: 32
  micro_batch_size: 4
advantage:
  k: 1.0
  k_prime: 1.0
  zeta: 0.05
train:
  iterations: 100
  games_per_iter: 4
  group_size: 8
  max_steps: 30
  success_reward: 10.0
  invalid_penalty: 0.1
  lr: 1.0e-5
  kl_coef: 0.01
  mini_batches: 4
eval:
  split: valid_unseen
  max_steps: 50
  greedy: true
