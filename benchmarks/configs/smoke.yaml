# Tiny end-to-end check (a few minutes): python -m benchmarks.train --config benchmarks/configs/smoke.yaml
inherit: alfworld_empg.yaml
name: smoke
out_dir: runs/smoke
policy:
  max_new_tokens: 96
train:
  iterations: 2
  games_per_iter: 2
  group_size: 2
  max_steps: 4
  mini_batches: 1
  save_every: 0
eval:
  max_tasks: 4
  max_steps: 4
