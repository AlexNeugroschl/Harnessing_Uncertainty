# Minutes: checks an arm runs end to end, e.g.
#   python -m benchmarks.train --config benchmarks/configs/arms/empg.yaml --tier smoke
out_dir: runs/smoke
policy:
  max_new_tokens: 96
train:
  iterations: 2
  games_per_iter: 2
  group_size: 2
  max_steps: 4
  mini_batches: 1
  save_every: 0
eval:
  max_tasks: 4
  max_steps: 4
